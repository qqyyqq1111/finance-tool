# 保活：免费版 Supabase 连续 7 天无数据库活动会自动暂停
# 每周一/三/五（UTC 03:00 ≈ 北京时间 11:00）登录专用账号发一次真实数据库查询
#
# 安全说明：ping@keepalive.local 是不含任何家庭数据的专用空账号，
# RLS 策略下它只能查到空结果；anon key 为 publishable 公开密钥（已在 js/cloud.js 中）。
# 凭据泄露的最坏后果仅是帮本项目多产生保活流量，无数据暴露面。
name: Keep Supabase Awake

on:
  schedule:
    - cron: '0 3 * * 1,3,5'
  workflow_dispatch: # 允许在 Actions 页面手动触发

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://vvbasvrbxscprmnvbvwm.supabase.co
      ANON_KEY: sb_publishable_UdkIEsYLmX3iLoKIqO29vg_D8qWNrX7
    steps:
      - name: Login keep-alive account
        id: login
        run: |
          TOKEN=$(curl -s -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"email":"ping@keepalive.local","password":"Fk9#mQ2vXn7$Lp4wRj8s"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          if [ -z "$TOKEN" ]; then
            echo "::error::Login failed — check whether the Supabase project is paused"
            exit 1
          fi
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Query database to generate activity
        run: |
          HTTP_CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/families?select=id&limit=1" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer ${{ steps.login.outputs.token }}")
          echo "Query responded with HTTP $HTTP_CODE, body: $(cat /tmp/resp.json)"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Expected HTTP 200 (empty RLS-filtered result), got $HTTP_CODE"
            exit 1
          fi
          echo "Supabase is awake — authenticated query executed successfully"
